name: comptabilite

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comptabilite-app
    restart: unless-stopped
    ports:
      # Port exposé sur la machine hôte : changez 8080 si le port est déjà pris par votre 1ère application
      - "8080:80"
    environment:
      APP_NAME: "Comptabilité"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      # Volumes nommés isolés pour éviter les conflits avec d'autres conteneurs
      - comptabilite_sqlite_data:/var/www/html/database
      - comptabilite_storage_data:/var/www/html/storage/app

volumes:
  comptabilite_sqlite_data:
    name: comptabilite_sqlite_data
  comptabilite_storage_data:
    name: comptabilite_storage_data

networks:
  default:
    name: comptabilite_network
